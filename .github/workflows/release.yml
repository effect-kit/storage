name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Verify the release without creating a PR or publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: effect-kit/.github/.github/workflows/release.yml@v1
    with:
      dry-run: ${{ inputs.dry-run }}
      timeout-minutes: 15
