name: Hosted providers

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider IDs separated by commas, or all (all requires every profile)
        type: string
        default: s3
      suite:
        description: Bounded provider suite
        type: choice
        options: [portable, signing, release, browser]
        default: portable

permissions:
  contents: read

concurrency:
  group: hosted-provider-qualification
  cancel-in-progress: false

jobs:
  providers:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # All profiles run sequentially, each with a bounded child timeout.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: effect-kit/.github/actions/setup@v1
      - name: Run selected profiles with explicit environment credentials
        run: pnpm test:providers --env --provider "$PROVIDER_SELECTION" --suite "$PROVIDER_SUITE"
        env:
          PROVIDER_SELECTION: ${{ inputs.provider }}
          PROVIDER_SUITE: ${{ inputs.suite }}
          # Same dotenv content as the local file; parsed in memory, never written or logged.
          STORAGE_PROVIDERS_ENV: ${{ secrets.STORAGE_PROVIDERS_ENV }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provider-evidence-${{ github.run_id }}
          path: .artifacts/providers/**/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
