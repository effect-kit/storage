name: Local S3 acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: effect-kit/.github/actions/setup@v1
        with:
          cache: pnpm
      - name: Run owned local S3 fixture
        run: pnpm test:s3:local
