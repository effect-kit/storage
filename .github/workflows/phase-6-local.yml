name: Filesystem and Worker acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: effect-kit/.github/actions/setup@v1
        with:
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: 1.4.4
      - name: Run actual filesystem processes
        run: pnpm test:filesystem ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: filesystem-${{ matrix.os }}-${{ matrix.runtime }}
          path: .artifacts/filesystem-${{ matrix.runtime }}.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: effect-kit/.github/actions/setup@v1
        with:
          cache: pnpm
      - name: Run owned local R2 binding
        run: pnpm test:r2:workers
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-r2-worker
          path: .artifacts/r2-workers/report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
